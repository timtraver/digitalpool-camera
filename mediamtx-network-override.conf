# mediamtx-network-override.conf
# Drop-in for mediamtx.service.
#
# PURPOSE: Allow MediaMTX to start when ethernet is NOT connected.
#
# By default mediamtx.service ships with After=network-online.target, which
# on Ubuntu/NetworkManager waits until a "required" interface (usually ethernet)
# is fully online.  Without an ethernet cable this target never fires and
# MediaMTX hangs, which in turn prevents the WebRTC admin preview from working
# over the WiFi hotspot.
#
# This drop-in:
#   1. Clears the network-online.target ordering/dependency so MediaMTX starts
#      as soon as NetworkManager is up — regardless of whether ethernet is
#      connected.
#   2. Orders MediaMTX after digitalpool-hotspot.service so the hotspot IP
#      (192.168.50.1) is already assigned when mediamtx-update-hosts.sh runs
#      as ExecStartPre.  This ensures the hotspot IP is included in the WebRTC
#      ICE candidate list so the admin preview works over hotspot immediately.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/mediamtx.service.d
#   sudo cp mediamtx-network-override.conf \
#           /etc/systemd/system/mediamtx.service.d/network-override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart mediamtx

[Unit]
# Clear the default After=network-online.target and Wants=network-online.target
# that ship with mediamtx so it no longer blocks on ethernet being present.
After=
Wants=
# Re-add only the dependencies we actually need:
#   NetworkManager must be running so nmcli / IP assignment works.
#   digitalpool-hotspot.service must be up so 192.168.50.1 exists when
#   mediamtx-update-hosts.sh runs and populates webrtcAdditionalHosts.
After=NetworkManager.service digitalpool-hotspot.service
Wants=NetworkManager.service digitalpool-hotspot.service
