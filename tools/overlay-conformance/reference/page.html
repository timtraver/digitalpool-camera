<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Exactly the font loading digitalpool-antd/public/index.html does, so the
         reference render uses the same faces the live overlay page would. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700&family=Bebas+Neue&family=Exo+2:wght@400;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Orbitron:wght@400;700&family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;600;700&family=Roboto:wght@400;700&family=Roboto+Condensed:wght@400;700&family=Saira+Condensed:wght@400;600;700&family=Teko:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="/antd-fonts/uniform-condensed/stylesheet.css" />
    <link rel="stylesheet" href="/antd-fonts/gill-sans-mt-condensed/stylesheet.css" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; }
      /* The app imports antd/dist/reset.css (src/index.js:19), which sets this
         globally. ElementRenderer's own boxes set boxSizing explicitly, but
         CircleFlag's bordered span does not — without this rule the reference
         render sizes flags 2px larger than production does. */
      *, *::before, *::after { box-sizing: border-box; }
      /* src/index.css:86 — what `fontFamily: inherit` resolves to in the app. */
      body {
        font-family: UniformCondensed, 'SF Pro Display', -apple-system, 'system-ui', 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      #root { width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/out/reference.bundle.js"></script>
  </body>
</html>
