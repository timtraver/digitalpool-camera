<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphics Overlay - Transparent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    canvas {
      display: block;
      width: 1920px;
      height: 1080px;
    }
  </style>
</head>
<body>
  <canvas id="graphics" width="1920" height="1080"></canvas>

  <script>
    const canvas = document.getElementById('graphics');
    const ctx = canvas.getContext('2d');
    let frameNumber = 0;

    // Drawing function (matches test-graphics.js)
    function draw() {
      // Clear canvas with transparent background
      ctx.clearRect(0, 0, 1920, 1080);

      // Draw a simple scoreboard (no animations to save CPU)
      ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
      ctx.fillRect(50, 50, 400, 150);

      // Draw border
      ctx.strokeStyle = "white";
      ctx.lineWidth = 2;
      ctx.strokeRect(50, 50, 400, 150);

      // Draw title
      ctx.fillStyle = "white";
      ctx.font = "bold 28px Sans";
      ctx.fillText("POOL MATCH", 70, 90);

      // Draw static score (update every 10 frames to save CPU)
      const score1 = Math.floor((frameNumber / 10) % 10);
      const score2 = Math.floor((frameNumber / 10) % 8);
      ctx.font = "bold 40px Sans";
      ctx.fillText(`${score1} - ${score2}`, 180, 150);

      frameNumber++;
    }

    // Update at 2 FPS (every 500ms)
    setInterval(draw, 500);
    
    // Initial draw
    draw();
  </script>
</body>
</html>
