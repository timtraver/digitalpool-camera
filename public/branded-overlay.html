<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DigitalPool Overlay</title>
<!--
  The overlay composited into streams from accounts WITHOUT the Advanced
  Streaming package (see SUBSCRIPTION_CHECK.md).  Those venues stream to their
  own YouTube / Facebook / RTMP destination, and this is what rides along
  instead of their own graphics overlay.

  Rendered by puppeteerOverlay.js in URL mode: headless Chromium screenshots it
  at 1920x1080 with NATIVE TRANSPARENCY, so there must be no page background —
  anything opaque here covers the whole video frame.  The page is static, so the
  device samples it on a long interval rather than every 2 s.

  dpadmin can point the branded overlay at a different URL entirely
  (Admin Settings -> Branded Overlay), in which case this page is unused.
-->
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;      /* must stay transparent — see above */
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Bottom-left lockup, clear of the lower-right corner most scoreboards and
     platform UI (YouTube's watermark, Facebook's live badge) occupy. */
  .brand {
    position: absolute;
    left: 48px;
    bottom: 44px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 26px 14px 20px;
    border-radius: 14px;
    background: rgba(6, 16, 27, 0.62);
    border: 1px solid rgba(18, 199, 255, 0.35);
    box-shadow: 0 6px 28px rgba(0, 0, 0, 0.45);
  }

  /* The logo art already carries the DigitalPool wordmark — do not repeat it
     in text next to itself. */
  .brand img {
    height: 54px;
    width: auto;
    display: block;
  }

  .brand .sub {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(18, 199, 255, 0.95);
    border-left: 1px solid rgba(255, 255, 255, 0.22);
    padding-left: 16px;
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="images/dp-logo-header.png" alt="" />
    <span class="sub">digitalpool.com</span>
  </div>
</body>
</html>
