<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — DigitalPool Camera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #0d1e35 0%, #000000 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: rgba(11, 30, 52, 0.95);
      border: 1px solid rgba(18, 199, 255, 0.25);
      border-radius: 14px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.6);
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 380px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .login-logo img { height: 52px; width: auto; }

    .login-logo-text {
      display: flex;
      flex-direction: column;
    }

    .login-logo-text span:first-child {
      font-size: 20px;
      font-weight: 700;
      color: white;
      line-height: 1;
    }

    .login-logo-text span:last-child {
      font-size: 11px;
      color: rgba(18, 199, 255, 0.8);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    h2 {
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: rgba(18,199,255,0.8);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: rgba(6,16,27,0.9);
      border: 1px solid rgba(18,199,255,0.25);
      border-radius: 7px;
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      margin-bottom: 18px;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus { border-color: #1890ff; }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1890ff 0%, #0d5a9e 100%);
      border: none;
      border-radius: 7px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 4px;
    }

    .btn-login:hover  { opacity: 0.88; }
    .btn-login:active { opacity: 0.75; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 7px;
      color: #fca5a5;
      font-size: 13px;
      padding: 10px 14px;
      margin-top: 16px;
      display: none;
      text-align: center;
    }

    .error-msg.visible { display: block; }

    .hotspot-hint {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(18,199,255,0.1);
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="images/dp-logo-header.png" alt="DigitalPool" />
      <div class="login-logo-text">
        <span>DigitalPool</span>
        <span>Camera Control</span>
      </div>
    </div>

    <h2>Sign in to continue</h2>

    <form id="loginForm" autocomplete="on">
      <label for="username">Username</label>
      <input type="text"     id="username" name="username" autocomplete="username" required autofocus />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>

    <div class="error-msg" id="errorMsg"></div>

    <div class="hotspot-hint">
      Connected via the DigitalPool WiFi hotspot?<br>
      Access is automatic — no login required.
    </div>
  </div>

  <script>
    const form     = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      loginBtn.disabled    = true;
      loginBtn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/';
        } else {
          errorMsg.textContent = data.error || 'Login failed. Please try again.';
          errorMsg.classList.add('visible');
        }
      } catch (err) {
        errorMsg.textContent = 'Network error — is the server running?';
        errorMsg.classList.add('visible');
      } finally {
        loginBtn.disabled    = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
